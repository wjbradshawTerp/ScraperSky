# Mercury muting TEST RUN (3d / 1d / 3d) -- same setup as config.mercury.yaml,
# shortened phases and its own experiment_name so it never consumes the real
# experiment's persisted arm assignments. Replicates the original Mercury muting
# procedure as closely as possible. Run with CONFIG_PATH=config.mercury-test.yaml
# (in .env for docker compose). Every key is documented in config.yaml; only
# the values that differ from its defaults matter here.
#
# The three account lists below are gitignored (they label named real
# accounts as untrustworthy) and must be present locally in the repo root.

platform: twitter

data_collection:
  targets:
    - home
    # Both streams are needed for analysis: intervention_history holds each
    # agent's muted (treatment) or counterfactual (control) list, which feed
    # posts are classified against by author id.
    - engagement_log
    - intervention_history

# No scripted follows -- the follow graph comes only from cold-start's
# follow_mix below, so every sockpuppet's starting composition is controlled.
actions:
  follow_all: false

timezone: America/New_York

account_lists:
  untrustworthy_sources: untrustworthy.json       # full inventory (1,408)
  untrustworthy_top434: untrustworthy_top434.json # top 434 by followed_by; file order is the stratification key -- don't re-sort
  news_sources: news_sources.json                 # full news inventory (1,346)

sockpuppet_config:
  persona_prompt: personas/mercury_basic.txt      # one minimal persona shared by every sockpuppet
  account_lists:
    - untrustworthy_top434
    - news_sources
  initialization_params:
    min_follows: 13
    max_follows: 13
    min_engagements: 15
    max_initialization_days: 1   # pre_treatment's 3d clock starts at launch and includes setup -- cap setup at 1d
    follow_mix:
      untrustworthy_top434: 3   # ~2.6 untrustworthy follows per participant in the Mercury pilot (3,149 / 1,210)
      news_sources: 10

experiment_design:
  experiment_name: mercury_muting_test
  treatment_arms:
    - control
    - treatment
  randomization:
    method: simple_random
    seed: 42
    ratios:
      control: 0.5
      treatment: 0.5
  # One shared persona means the intervention must be the only difference
  # between arms -- keep the condition out of what the model sees.
  blind_prompt: true
  phase_durations:
    initialization: adaptive
    pre_treatment: 3d
    treatment: 1d
    post_treatment: 3d

intervention:
  action: mute
  target_accounts: untrustworthy_top434
  selection_rule: stratified70    # 7 of every block of 10 + 3 of the last 4 = 304
  execution_time: end_of_pre_treatment
  target_interval:                # random gap between mutes (~2-3h for 304) -- not back to back
    min_interval: 20s
    max_interval: 40s
  rejection_backoff:              # if X rejects a mute: wait 1m, doubling per consecutive
    backoff: 1m                   # rejection up to 30m, reset on the next success
    max_backoff: 30m
  applies_to_arms:
    - treatment                   # control agents get the same draw, recorded as counterfactual
