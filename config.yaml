# Behavioral/experiment configuration for ScraperSky.
#
# Anything in this file is non-secret and safe to share/commit. Credentials
# (TWITTER_AUTH_TOKEN, TWITTER_BEARER_TOKEN, TWITTER_CSRF_TOKEN) and
# machine-specific Docker volume paths (HOST_OUTPUT_DIR, CONTAINER_OUTPUT_DIR,
# OUTPUT_DIR) stay in .env instead -- see .env.example.

# Which scraper/platform implementation to run. Currently only "twitter" is
# implemented (see src/scraper/__init__.py's SCRAPER_REGISTRY).
platform: twitter

# data_collection.targets: which timeline(s) to observe this run. Each
# entry maps to an observation method on the scraper (see
# src/scraper/twitter.py):
#   home      - X's algorithmic default feed, i.e. the "Home" tab.
#               GraphQL operation `HomeTimeline` (fetch_home).
#   following - X's reverse-chronological feed, i.e. the "Following" tab.
#               GraphQL operation `HomeLatestTimeline` (fetch_following).
#   search    - keyword search results (fetch_search_timeline);
#               requires search_query to be set below
# `home` and `following` are easy to mix up by name alone since X's own
# GraphQL operation names (HomeTimeline / HomeLatestTimeline) don't map onto
# "home"/"following" in an obvious way at a glance -- see the naming key
# comment near the top of src/scraper/twitter.py if in doubt.
#
# Observation is decoupled from actions (see `actions` below) -- previously
# a single "mode" controlled both what was scraped AND whether follow_all()
# ran; now they're independent.
#
# `targets` also accepts the paper's two derived DATA STREAMS, which aren't
# feeds to observe but extra JSONL output written as the account acts:
#   engagement_log       - every action this account performs (paper section
#                          4's "Engagement History"), whatever triggered it:
#                          cold-start, follow_all, an Agent Runtime decision,
#                          or an orchestrator intervention.
#   intervention_history - what the orchestrator's intervention did to this
#                          account and which accounts it affected.
#
# Multiple observation targets are supported in both modes: Agent Runtime
# observes a snapshot of every listed target each activation, and the old
# scripted path round-robins a few pages per target per rotation.
data_collection:
  targets:
    - home
    # - following
    # - engagement_log
    # - intervention_history

  # Query text for the "search" target above (X's "All of these words"
  # search — plain keywords, no special query-operator handling yet).
  # Only read when "search" is one of the targets.
  search_query: trump

  # How often platform state is observed. `every_visit` (the default, and
  # the paper's own value) means one observation per activation, which is
  # what the runtime does; no other frequency is implemented.
  # observation_frequency: every_visit

  # "full" (default) logs the constructed prompt, raw model output, and the
  # observed post in the Agent Runtime's runtime_log JSONL; "minimal" logs
  # just the decision/execution trace. Only meaningful in Agent Runtime mode.
  # logging: full

# actions: non-LLM scripted actions to run once at startup, before
# observation begins. This is a stand-in for the future LLM-driven action
# loop (roadmap Phase 4) -- for now it's just "should follow_all() run this
# session".
actions:
  follow_all: true

# Seconds to wait between timeline fetch requests. 2s minimum recommended
# to stay comfortably under Twitter's rate limits.
scroll_delay: 2

# Retry behavior for a single pagination cursor before giving up on it and
# restarting the timeline from the top (see _fetch_and_parse_with_retry in
# src/scraper/twitter.py). fetch_retry_backoff is in seconds and is
# multiplied by the attempt number (1st retry waits Nx1s, 2nd waits Nx2s...).
fetch_max_retries: 5
fetch_retry_backoff: 5

# Exponential backoff for the opposite problem: fetches are succeeding but
# returning nothing NEW (every tweet in the batch was already collected this
# run -- see the dedup logic in _scrape_timeline for home/search).
# This happens when polling faster than the feed refreshes and just hammers
# the API for no benefit. Each consecutive all-duplicate batch roughly
# doubles the wait (empty_batch_backoff_base * 2^n), capped at
# empty_batch_backoff_max; a batch with any new tweet resets the backoff to
# zero. This wait is on top of scroll_delay, not a replacement for it.
#
# empty_batch_backoff_jitter randomizes each wait by +/- this fraction (0.2 =
# +/-20%) so the cadence isn't a mechanically clean 1x/2x/4x/8x/... sequence
# -- a perfect power-of-two backoff is itself a detectable non-human pattern.
empty_batch_backoff_base: 5
empty_batch_backoff_max: 300
empty_batch_backoff_jitter: 0.2

# Timezone used for timestamping output files/records (IANA zoneinfo key,
# e.g. "America/New_York", "UTC").
timezone: America/New_York

# account_lists: named collections of accounts, referenced by name from
# code (e.g. follow_all() reads "follow_list"). Each value is a path to a
# JSON file shaped like follow_user_ids.json:
#   {"users": [{"user_id": "...", "_comment": "..."}]}
# Relative paths are resolved against this file's own directory.
#
# Add more named lists here as the experiment framework grows (e.g.
# untrustworthy_sources, prominent_news_sources for the Mercury Project
# case study) — nothing else needs to change until code actually consumes
# a given name.
account_lists:
  follow_list: follow_user_ids.json
  untrustworthy_sources: untrustworthy_sources.json
  trustworthy_sources: trustworthy_sources.json

# sockpuppet_config.initialization_params: cold-start initialization
# (roadmap Phase 4a). When set (here or per-account) and this account's
# agent_state hasn't already recorded initialization as complete, the
# scraper follows accounts from `account_lists` below and likes/reposts
# tweets from its own For You feed -- self-throttled to stay under the
# live follow rate limit (see TwitterScraper.FOLLOW_RATE_LIMIT) -- until
# min_follows/min_engagements are met or max_initialization_days elapses.
# This runs BEFORE observation/data_collection begins for that account.
#
# Commented out by default: this performs real follow/like/repost actions
# against the live account, so uncomment and set real values deliberately.
# account_lists referenced here must already exist in the account_lists
# map above.
#
# Cold-start follow candidates are a SEEDED random draw across every list
# named in sockpuppet_config.account_lists, so the initial follow graph is
# reproducible from the seed rather than a fresh shuffle each run. Two
# modes:
#   - follow_mix set: draw exactly that many from each named list. Use this
#     when the composition matters -- e.g. how many untrustworthy sources a
#     sockpuppet follows is a design parameter in the Mercury case study,
#     not something that should depend on file lengths.
#   - follow_mix omitted: draw from the pooled union of all the lists, so
#     the mix lands proportional to their sizes.
# max_follows caps the total either way, and must be >= min_follows.
# The draw is namespaced per account, so each sockpuppet gets a different
# mix that is still reproducible from the one recorded seed.
#
# sockpuppet_config:
#   account_lists:
#     - untrustworthy_sources
#     - trustworthy_sources
#   initialization_params:
#     min_follows: 15
#     min_engagements: 15
#     max_initialization_days: 3
#     max_follows: 15
#     follow_seed: 42          # optional; defaults to the experiment's randomization seed
#     follow_mix:              # optional; omit for a proportional draw from the union
#       untrustworthy_sources: 5
#       trustworthy_sources: 10

# sockpuppet_config.persona_prompt: enables the Agent Runtime (roadmap
# Phase 4) -- the LLM-driven Observation -> Prompt Construction -> Decision
# -> Execution -> Logging cycle, using LangChain (via langchain-ollama,
# against a LOCAL Ollama server -- see .env.example's OLLAMA_BASE_URL note,
# especially if running via docker compose). Runs AFTER cold-start,
# REPLACING the old scripted single-target observation loop for this
# account. Path is resolved relative to this file's directory, same as
# account_lists.
#
# `phase`/`treatment_arm` are stand-ins for what the Experiment Orchestrator
# (roadmap Phase 5) will assign per-agent once it exists -- set manually for
# now. `activation_schedule` controls how long the runtime waits between
# decision cycles; `truncated_powerlaw` is approximated as a log-uniform
# draw over [min_interval, max_interval] (see TwitterScraper.
# _sample_activation_interval).
#
# Commented out by default: this makes real LLM calls and real
# follow/like/repost/mute actions against the live account.
#
# phase/treatment_arm below are a static stand-in, used only when this
# account has no experiment_design.treatment_arms configured (see below) --
# an orchestrated account's real phase/treatment_arm come from the shared
# Experiment Orchestrator (roadmap Phase 5) instead, and these two keys are
# ignored for it.
#
# sockpuppet_config.action_rate_limits: per-action pacing, applied on top of
# whatever the platform itself enforces. An action with no entry is uncapped.
# `max_per_hour` is a rolling-hour cap; `min_interval` additionally forbids
# two of that action closer together than the given duration (both matter --
# an hourly cap alone still permits a burst of several within a minute).
#
# When a budget has no slot free the decision is downgraded to a logged
# no_action with `no_action_reason: "rate_capped"` -- it never blocks the
# activation, so the agent keeps evaluating the rest of the feed.
#
# The retweet values below are sized from live observation, NOT a documented
# platform limit: on 2026-09-09 only 35% of retweet attempts succeeded, with
# a mix of misleading refusals (404 / "looks automated" / a "daily limit"
# message that was demonstrably false). ~6 successes/hour was sustained, so
# 4/hour with an 8m floor sits conservatively inside that. See ROADMAP.md's
# retweet-reliability entry before changing these.
#
# sockpuppet_config:
#   persona_prompt: personas/example_persona.txt
#   phase: pre_treatment
#   treatment_arm: control
#   activation_schedule:
#     distribution: truncated_powerlaw
#     min_interval: 15m
#     max_interval: 6h
#   action_rate_limits:
#     retweet:
#       max_per_hour: 4
#       min_interval: 8m

# experiment_design.experiment_name: used to build a readable experiment_id
# (`<experiment_name>::<account_name>`) in the Agent Runtime's
# experiment_context.
#
# experiment_design.treatment_arms: setting this is what opts an account
# INTO the shared Experiment Orchestrator (roadmap Phase 5) -- every account
# that sets it must agree on experiment_name/randomization/phase_durations
# (validated at startup), since those are experiment-wide, not per-account.
# Omitting treatment_arms (the default) means an account is entirely
# unaffected by orchestration -- it keeps using the static
# sockpuppet_config.phase/treatment_arm above instead.
#
# experiment_design.randomization.method: assignment procedure. Only
# `simple_random` is implemented (the paper names stratified and blocked
# randomization as future extensions); anything else is rejected at startup
# rather than silently treated as simple random.
#
# experiment_design.randomization.seed: makes the treatment-arm split
# reproducible. Assignment happens at the END of the pre-treatment phase --
# not at startup -- matching the paper ("At the conclusion of the
# pre-treatment period, the orchestrator assigns each sockpuppet to an
# experimental condition"), so agents run a condition-blind baseline first.
# It's then persisted, so a later seed change never silently reassigns an
# already-committed experiment. ratios must sum to 1.0 across every arm
# (omit ratios for an even split).
#
# experiment_design.recovery_policy: how an orchestrated account recovers
# from a failed activation (paper section 3.4 responsibility #6). Defaults
# to {max_consecutive_failures: 5, backoff: 1m, max_backoff: 30m} -- the
# agent waits `backoff` doubled per consecutive failure (capped at
# max_backoff) and gives up after max_consecutive_failures, without
# affecting any other account's schedule.
#
# experiment_design.phase_durations: per phase, driving automatic
# transitions through the fixed sequence pre_treatment -> treatment ->
# post_treatment. A phase with no entry here never auto-transitions -- the
# experiment just stays there. Each entry is either:
#   - a bare shorthand duration (e.g. "3d", "6h") -- transitions once that
#     much wall-clock time has elapsed since the phase began, or
#   - {max_duration: ..., max_action_count: ...} -- transitions once EITHER
#     condition is met, whichever comes first. max_action_count counts real,
#     agent-selected actions (like/retweet/follow/mute -- not no_action) by
#     any ONE participating account during this phase; at least one of the
#     two keys must be set.
# Whatever ends a phase, the orchestrator will never actually leave it while
# an intervention triggered by it is still pending/running for any
# participating account -- a long target list, transient failures, or rate
# limits extend how long a phase takes rather than causing a mute (or other
# intervention action) to be skipped.
#
# Reaching the end of the LAST phase (post_treatment) completes the
# experiment: experiment_status flips to "completed", a termination event is
# logged, and every account stops acting and exits so the process shuts down
# cleanly instead of running on past the end of the experiment.
#
# experiment_design:
#   experiment_name: mercury_muting
#   treatment_arms:
#     - control
#     - treatment
#   randomization:
#     method: simple_random
#     seed: 42
#     ratios:
#       control: 0.5
#       treatment: 0.5
#   recovery_policy:
#     max_consecutive_failures: 5
#     backoff: 1m
#     max_backoff: 30m
#   phase_durations:
#     initialization: adaptive   # ends on sockpuppet_config.initialization_params, not a clock
#     pre_treatment: 3d
#     treatment:                        # example of the dict form: whichever comes first
#       max_duration: 7d
#       max_action_count: 10000
#     post_treatment: 3d   # omit to run indefinitely with no further auto-transition

# intervention: top-level namespace, sibling to experiment_design/
# sockpuppet_config/data_collection (paper section 3.1) -- only read for
# accounts with experiment_design.treatment_arms set above. Fires exactly
# once, at `execution_time`, for every account whose treatment arm is in
# `applies_to_arms`: samples per `selection_rule` from `target_accounts`
# (a name from account_lists below) and runs `action` against each sampled
# user_id via that account's own scraper -- reusing the same dispatcher the
# Agent Runtime and cold-start already use, not a separate action path.
# Every target gets a real attempt, retried with backoff, and the phase
# won't advance until the whole intervention has finished.
#
#   action         - any execute_action() action, e.g. mute / follow
#   target_accounts- an account_lists name holding the candidate accounts
#   selection_rule - `all`, or `randomNN` for a random NN% sampled
#                    independently per sockpuppet (e.g. random70)
#   execution_time - end_of_pre_treatment (fires as `treatment` begins) or
#                    end_of_treatment (fires as `post_treatment` begins)
#   applies_to_arms- which treatment_arms values receive it; this is the
#                    explicit form of the paper's "treatment agents receive
#                    the configured intervention, control agents receive none"
#
# intervention:
#   action: mute
#   target_accounts: untrustworthy_sources
#   selection_rule: random70
#   execution_time: end_of_pre_treatment
#   applies_to_arms:
#     - treatment
